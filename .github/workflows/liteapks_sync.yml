name: LiteAPKs to Telegram Auto-Poster

on:
  schedule:
    # Redundant Off-Peak Triggers ensuring posts NEVER miss an hour:
    # Runs at off-peak minutes 15 and 45 (eliminates GitHub queue delay spikes at minute 0).
    # The internal hourly cooldown in agent.py enforces exact ~1-hour intervals (~50m minimum gap).
    # If GitHub cluster delays or queues one run, the second catch-up run guarantees 0 missed hours.
    - cron: '15 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI or Telegram Bot anytime

concurrency:
  group: liteapks-sync-run
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run LiteAPKs Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          DEVUPLOADS_API_KEY: ${{ secrets.DEVUPLOADS_API_KEY }}
          MAX_APKS_PER_RUN: 10
        run: |
          python agent.py

      - name: Commit & Push Updated History
        if: always()
        run: |
          git config --global user.name "LiteAPKs-Agent-Bot"
          git config --global user.email "bot@liteapks-agent.local"
          git add -A
          git diff --staged --quiet || (git commit -m "chore: update sent APKs database and state [skip ci]" && git pull --rebase origin main && git push origin main)

      - name: Send Telegram SOS Alert on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>LiteAPKs Agent Workflow FAILED!</b>%0A%0A<b>Repo:</b> ${{ github.repository }}%0A<b>Run ID:</b> ${{ github.run_id }}%0A<b>Event:</b> ${{ github.event_name }}%0A%0A👉 <a href='$RUN_URL'>View Failed Logs on GitHub</a>"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$ADMIN_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${ADMIN_CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=HTML" || true
          fi

      - name: Create GitHub Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 LiteAPKs Agent Failure: Run #${context.runNumber}`;
            const body = `### 🚨 Automated Failure Notification\n\n` +
              `- **Repository**: ${context.repo.owner}/${context.repo.repo}\n` +
              `- **Run Number**: #${context.runNumber}\n` +
              `- **Run ID**: [${context.runId}](${runUrl})\n` +
              `- **Triggered By**: ${context.eventName}\n` +
              `- **Ref**: ${context.ref}\n` +
              `- **Commit**: ${context.sha}\n\n` +
              `Please check the [Action Run Logs](${runUrl}) to inspect the failure details and error stack trace.`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'automated-alert']
            });
